name: dnsblackhole

services:
  dnsblackhole:
    # build 只是源码构建回退，正常部署走 image；免 clone 的部署片段见 docs/deployment/docker.md
    build:
      context: .
    image: ${DNSBLACKHOLE_IMAGE_REPO:-ghcr.io/wanwan-doudou/dnsblackhole}:${DNSBLACKHOLE_VERSION:-latest}
    restart: unless-stopped
    # host 模式直接用宿主网络栈，没有端口映射可绑，监听地址由应用内「监听地址」决定
    network_mode: host
    environment:
      DNSBLACKHOLE_CONTAINER: "1"
    command:
      - serve
      - --data-dir
      - /var/lib/dnsblackhole
      - --web-listen
      - 0.0.0.0:3000
      - --admin-password-file
      - /run/secrets/dnsblackhole_admin_password
    volumes:
      - dnsblackhole-data:/var/lib/dnsblackhole
    secrets:
      - dnsblackhole_admin_password
    tmpfs:
      - /run/dnsblackhole:mode=0755,uid=10001,gid=10001
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    stop_grace_period: 20s

volumes:
  dnsblackhole-data:

secrets:
  dnsblackhole_admin_password:
    file: ./dnsblackhole-admin-password.txt
