name: dnsblackhole

services:
  dnsblackhole:
    # build 只是源码构建回退，正常部署走 image；免 clone 的部署片段见 docs/deployment/docker.md
    build:
      context: .
    image: ${DNSBLACKHOLE_IMAGE_REPO:-ghcr.io/wanwan-doudou/dnsblackhole}:${DNSBLACKHOLE_VERSION:-latest}
    restart: unless-stopped
    environment:
      DNSBLACKHOLE_CONTAINER: "1"
    command:
      - serve
      - --data-dir
      - /var/lib/dnsblackhole
      - --web-listen
      - 0.0.0.0:3000
      - --admin-password-file
      - /run/secrets/dnsblackhole_admin_password
    # 默认绑定全部网卡以便服务局域网；只供本机或固定网卡使用时，
    # 通过 DNSBLACKHOLE_BIND_ADDRESS / DNSBLACKHOLE_BIND_ADDRESS_V6 收窄
    ports:
      - "${DNSBLACKHOLE_BIND_ADDRESS:-0.0.0.0}:53:53/udp"
      - "${DNSBLACKHOLE_BIND_ADDRESS:-0.0.0.0}:53:53/tcp"
      - "${DNSBLACKHOLE_BIND_ADDRESS:-0.0.0.0}:3000:3000/tcp"
      - target: 53
        published: "53"
        host_ip: "${DNSBLACKHOLE_BIND_ADDRESS_V6:-::}"
        protocol: udp
      - target: 53
        published: "53"
        host_ip: "${DNSBLACKHOLE_BIND_ADDRESS_V6:-::}"
        protocol: tcp
      - target: 3000
        published: "3000"
        host_ip: "${DNSBLACKHOLE_BIND_ADDRESS_V6:-::}"
        protocol: tcp
    volumes:
      - dnsblackhole-data:/var/lib/dnsblackhole
    secrets:
      - dnsblackhole_admin_password
    tmpfs:
      - /run/dnsblackhole:mode=0755,uid=10001,gid=10001
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    stop_grace_period: 20s

volumes:
  dnsblackhole-data:

secrets:
  dnsblackhole_admin_password:
    file: ./dnsblackhole-admin-password.txt
